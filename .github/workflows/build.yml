name: Build e Geracao de APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias e compilar web
        run: |
          # Entra na pasta do projeto se estiver dentro de uma subpasta
          if [ -d "Perpetual Calendar Planner Pro" ]; then cd "Perpetual Calendar Planner Pro"; fi
          if [ -d "agenda-perpétua" ]; then cd "agenda-perpétua"; fi
          if [ -d "Agenda-Perpetua-" ]; then cd "Agenda-Perpetua-"; fi
          
          # Instala dependencias e compila o projeto React/Vite
          npm install
          npm run build || npm run generate || true

      - name: Salvar arquivos da WEB compilada (dist)
        uses: actions/upload-artifact@v4
        with:
          name: site-compilado-dist
          path: |
            dist/
            **/dist/
            build/
            **/build/
            
