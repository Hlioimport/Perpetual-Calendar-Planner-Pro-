name: Build e Geracao de APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descompactar arquivos ZIP se existirem
        run: |
          # Descompacta arquivos .zip tratando caminhos com espaco
          find . -maxdepth 2 -type f -iname "*.zip" -print0 | while IFS= read -r -d '' zipfile; do
            echo "Descompactando $zipfile..."
            unzip -o "$zipfile"
          done

      - name: Encontrar pasta e compilar web
        run: |
          # Procura o arquivo package.json em qualquer subpasta
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          echo "Pasta do projeto encontrada: $TARGET_DIR"
          
          if [ -z "$TARGET_DIR" ]; then
            echo "ERRO: Nenhum package.json foi encontrado no repositorio!"
            exit 1
          fi

          cd "$TARGET_DIR"
          
          # Instala dependencias e compila
          npm install
          npm run build || npm run generate || true

      - name: Salvar arquivos da WEB compilada (dist)
        uses: actions/upload-artifact@v4
        with:
          name: site-compilado-dist
          path: |
            dist/
            **/dist/
            build/
            **/build/
